<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <!-- MiniSnap logo (windows/src/Icons.cs AppIcon): orange to pink rounded square, white crop corners and dot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6E32"/>
      <stop offset="1" stop-color="#E12855"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" ry="7" fill="url(#bg)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="8,15 8,8 15,8"/>
    <polyline points="17,24 24,24 24,17"/>
  </g>
  <circle cx="16" cy="16" r="3" fill="#FFFFFF"/>
</svg>
